name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "media/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  ci:
    name: Tests & Checks
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        node-version: [20.x, 22.x]
        os: [ubuntu-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run tests with coverage
        if: matrix.node-version == '22.x'
        run: npm run coverage

      - name: Run tests
        if: matrix.node-version != '22.x'
        run: npm test

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage/

  build:
    name: Build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [ci]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify the build output
        run: |
          test -f dist/index.html || { echo "dist/index.html is missing"; exit 1; }
          test -f dist/CNAME || { echo "dist/CNAME is missing - the custom domain would be dropped"; exit 1; }
          test -f dist/sitemap-index.xml || { echo "dist/sitemap-index.xml is missing"; exit 1; }

          echo "Built $(find dist -name '*.html' | wc -l) pages"

  lockfile-check:
    name: Validate package-lock.json
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [ci]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check package-lock integrity
        run: |
          npm -v
          checksum=$(sha512sum package-lock.json)
          npm install --package-lock-only --no-audit
          if ! echo ${checksum} | sha512sum --quiet -c -; then
            echo "package-lock.json was modified unexpectedly"
            echo "Please rebuild it using npm@$(npm -v) and commit the changes"
            exit 1
          fi

  quality-scan:
    name: Code Quality Analysis
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [ci, build, lockfile-check]
    if: ${{ always() && (needs.ci.result == 'success') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v6
        with:
          name: coverage-report
          path: coverage/

      - name: Verify coverage output
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "❌ ERROR: coverage/lcov.info not found"
            ls -la coverage/ || echo "coverage/ directory doesn't exist"
            exit 1
          fi
          echo "✅ Coverage output found"
          head -20 coverage/lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=klaudiosinani_klaudiosinani.github.io
            -Dsonar.organization=klaudiosinani
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.coverage.exclusions=tests/**,src/shared/services/og/**,*.config.ts
            -Dsonar.scm.revision=${{ github.event.pull_request.head.sha }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
