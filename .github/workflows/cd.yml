name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify_ci:
    name: Verify CI Success
    runs-on: ubuntu-latest
    permissions: {}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'master')
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve and validate the deployable commit
        id: resolve
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          FALLBACK_SHA: ${{ github.sha }}
        run: |
          SHA="${HEAD_SHA:-$FALLBACK_SHA}"

          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Refusing to deploy an unexpected commit reference"
            exit 1
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying $SHA"

  build:
    name: Build Site
    runs-on: ubuntu-latest
    needs: verify_ci
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify_ci.outputs.sha }}
          persist-credentials: false

      - name: Install, build, and upload the site
        uses: withastro/action@56781b97402ce0487b7e61ce2cb960c0e2cc5289

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
